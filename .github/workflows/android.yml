name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KMP library and Android sample
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate KMP source boundaries
        run: ./scripts/validate-kmp-boundaries.sh

      - name: Build and test KMP library
        run: >-
          gradle
          :elegant-ui:build
          --stacktrace
          --warning-mode all
          --no-daemon

      - name: Publish KMP Maven repository
        run: >-
          gradle
          :elegant-ui:publishAllPublicationsToBuildRepository
          --stacktrace
          --warning-mode all
          --no-daemon

      - name: Assemble Android sample APK
        run: >-
          gradle
          :sample:assembleDebug
          --stacktrace
          --warning-mode all
          --no-daemon

      - name: Extract Android AAR and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          aar_path="$(find elegant-ui/build/repo -type f -name '*.aar' -print -quit)"
          if [[ -z "$aar_path" ]]; then
            echo "The KMP Maven publication did not contain an Android AAR." >&2
            exit 1
          fi

          cp "$aar_path" dist/elegant-ui-android.aar
          sha256sum dist/elegant-ui-android.aar > dist/elegant-ui-android.aar.sha256
          sha256sum sample/build/outputs/apk/debug/sample-debug.apk > dist/sample-debug.apk.sha256

          (
            cd elegant-ui/build/repo
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > dist/elegant-ui-maven-repository.sha256

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: elegant-ui-sample-apk
          path: |
            sample/build/outputs/apk/debug/sample-debug.apk
            dist/sample-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete KMP Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: elegant-ui-maven-repository
          path: |
            elegant-ui/build/repo/**
            dist/elegant-ui-maven-repository.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload direct Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: elegant-ui-android-aar
          path: |
            dist/elegant-ui-android.aar
            dist/elegant-ui-android.aar.sha256
          if-no-files-found: error
          retention-days: 14
