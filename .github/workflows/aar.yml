name: Build Single AAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build merged AARs
        run: ./gradlew :elyon-ui:fatAar :elyon-ui:fatAarNoBlur
      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v7
        with:
          name: elyon-aar
          path: |
            elyon-ui/build/fatAar/elyon-all-release.aar
            elyon-ui/build/fatAar/elyon-all-noblur-release.aar
          if-no-files-found: error
